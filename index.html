<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fufalemi | Faarfataa</title>
<meta name="description" content="Fufalemi: faarfataa Afaan Oromoo. Faarfannaa haaraa dhaggeeffadhu.">
<meta name="theme-color" content="#0b0b14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎤%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f6f4ff;--card:#fff;--text:#16132b;--muted:#5b5778;--accent:#7c3aed;--accent2:#ec4899;--line:rgba(22,19,43,.1);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b14;--card:#15152a;--text:#f3f1ff;--muted:#a9a5c8;--line:rgba(255,255,255,.1);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0b14;--card:#15152a;--text:#f3f1ff;--muted:#a9a5c8;--line:rgba(255,255,255,.1);color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
.hero{text-align:center;padding:56px 0 32px;background:radial-gradient(600px 300px at 50% 0,rgba(124,58,237,.35),transparent 70%)}
.avatar{width:132px;height:132px;border-radius:50%;margin:0 auto 20px;display:grid;place-items:center;font-size:56px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 40px rgba(124,58,237,.45)}
h1{font-size:clamp(2rem,8vw,3rem);margin:0;letter-spacing:-.02em;line-height:1.1}
.tag{color:var(--muted);margin:8px 0 22px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;margin:4px;border-radius:999px;font-weight:600;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
section{padding:30px 0}
h2{font-size:1.35rem;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.songs{display:grid;gap:18px}
.post b{display:block;margin:12px 0 2px}.pdate{color:var(--muted)}.ptext{white-space:pre-wrap;margin:8px 0 0}
.vid{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000 center/cover no-repeat}
.vid button{position:absolute;inset:0;width:100%;border:0;background:rgba(0,0,0,.28);color:#fff;font-size:52px;cursor:pointer}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.socials{display:grid;gap:12px}
.soc{display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:16px;text-decoration:none;color:#fff;font-weight:600}
.soc svg{width:26px;height:26px;fill:#fff;flex:none}
.soc.yt{background:#e11d1d}.soc.fb{background:#1877f2}.soc.tt{background:#111;border:1px solid #333}
.svc{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:6px}
.form label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
.form input,.form textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);font:inherit}
.form .btn{border:0;cursor:pointer;font:inherit;font-weight:600;margin-top:12px}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:28px 0 40px}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="avatar">🎤</div>
  <h1 id="name"></h1>
  <p class="tag" id="tagline"></p>
  <a class="btn" href="#faarfannaa">▶ Faarfannaa dhaggeeffadhu</a>
  <a class="btn ghost" href="#quunnamtii">Nu quunnami</a>
</div></header>
<main class="wrap">
  <section><h2>Waa’ee koo</h2><div class="card"><p id="bio" style="margin:0"></p></div></section>
  <section id="faarfannaa"><h2>Faarfannaa haaraa</h2><div class="songs" id="songs"></div></section>
  <section><h2>Na hordofi</h2><div class="socials" id="socials"></div></section>
  <section id="quunnamtii"><h2>Quunnamtii</h2><div class="card">
  <p style="margin-top:0">Yaada keessan, gaaffii ykn nu jajjabeessuuf asitti nuuf ergaa:</p>
  <div class="form">
    <label for="fn">Maqaa kee</label><input id="fn" placeholder="Maqaa">
    <label for="fm">Yaada ykn ergaa kee</label><textarea id="fm" rows="4" placeholder="Ergaa kee as barreessi…"></textarea>
    <button class="btn" id="sendMail" type="button">✉ Email’n ergi</button>
    <button class="btn" id="sendWa" type="button">WhatsApp’n ergi</button>
  </div>
  <p style="margin:16px 0 8px;color:var(--muted)">Yookaan kallattiin:</p>
  <a class="btn ghost" id="mail" href="#">✉ Email</a>
  <a class="btn ghost" id="tel" href="#">📞 Bilbili</a>
  <a class="btn ghost" id="msg" href="#" target="_blank" rel="noopener">Facebook</a>
</div></section>
</main>
<footer><div class="wrap">© <span id="yr"></span> <span id="name2"></span>. Mirgi hundi eegameera.</div></footer>
<script>
var CONFIG={
  name:"Fufalemi",
  tagline:"Faarfataa · Afaan Oromoo",
  bio:"Faarfataa Afaan Oromoo dha. Asirratti faarfannaa koo haaraa dhaggeeffachuu fi kanneen biroo hordofuu dandeessu.",
  youtube:"https://youtube.com/@fufalemi",
  facebook:"https://www.facebook.com/profile.php?id=61596561683551",
  tiktok:"https://www.tiktok.com/@farfufalemi",
  email:"fufalemi10@gmail.com",
  phone:"0910560036",
  phoneIntl:"251910560036"
};
function el(i){return document.getElementById(i)}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
document.title=CONFIG.name+" | Faarfataa";
el("name").textContent=CONFIG.name;el("name2").textContent=CONFIG.name;
el("tagline").textContent=CONFIG.tagline;el("bio").textContent=CONFIG.bio;
el("yr").textContent=new Date().getFullYear();el("msg").href=CONFIG.facebook;
el("mail").href="mailto:"+CONFIG.email+"?subject="+encodeURIComponent("Yaada fi jajjabeessa");
el("tel").href="tel:+"+CONFIG.phoneIntl;

function msgText(){var n=el("fn").value.trim(),m=el("fm").value.trim();return (n?"Maqaan koo "+n+".\n":"")+m}
el("sendMail").onclick=function(){location.href="mailto:"+CONFIG.email+"?subject="+encodeURIComponent("Yaada fi jajjabeessa")+"&body="+encodeURIComponent(msgText())};
el("sendWa").onclick=function(){window.open("https://wa.me/"+CONFIG.phoneIntl+"?text="+encodeURIComponent(msgText()),"_blank")};

function render(list){
  var box=el("songs");
  if(!list||!list.length){box.innerHTML='<div class="card">Faarfannaan haaraan dhiyeenyatti asitti ni dabalama. Yeroo amma YouTube kootii ilaali.<br><br><a class="btn" href="'+esc(CONFIG.youtube)+'" target="_blank" rel="noopener">▶ YouTube koo</a></div>';return}
  box.innerHTML=list.map(function(x){
    var v=/^[\w-]{11}$/.test(x.id||"")?'<div class="vid" data-id="'+x.id+'" style="background-image:url(https://i.ytimg.com/vi/'+x.id+'/hqdefault.jpg)"><button aria-label="Play">▶</button></div>':"";
    var t=x.text?'<p class="ptext">'+esc(x.text)+'</p>':"";
    var d=x.date?'<small class="pdate">'+esc(x.date)+'</small>':"";
    return '<article class="card post">'+v+'<b>'+esc(x.title||"")+'</b>'+d+t+'</article>';
  }).join("");
  box.onclick=function(e){
    var v=e.target.closest(".vid");if(!v||v.querySelector("iframe"))return;
    v.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+v.dataset.id+'?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
  };
}
fetch("songs.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(render).catch(function(){render([])});
var ICON={
yt:'<svg viewBox="0 0 24 24"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2C.5 9.1.5 12 .5 12s0 2.9.5 4.8a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1c.5-1.9.5-4.8.5-4.8s0-2.9-.5-4.8zM9.7 15.5v-7l6 3.5-6 3.5z"/></svg>',
fb:'<svg viewBox="0 0 24 24"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.3v7A10 10 0 0 0 22 12z"/></svg>',
tt:'<svg viewBox="0 0 24 24"><path d="M16.6 5.8A4.3 4.3 0 0 1 15.5 3h-3.1v12.4a2.6 2.6 0 1 1-1.8-2.5V9.7a5.7 5.7 0 1 0 4.9 5.7V9a7.4 7.4 0 0 0 4.3 1.4V7.3a4.3 4.3 0 0 1-3.2-1.5z"/></svg>'};
el("socials").innerHTML=[["yt","YouTube",CONFIG.youtube],["tt","TikTok",CONFIG.tiktok],["fb","Facebook",CONFIG.facebook]].map(function(x){return '<a class="soc '+x[0]+'" href="'+esc(x[2])+'" target="_blank" rel="noopener">'+ICON[x[0]]+x[1]+'</a>'}).join("");
</script>
</body>
</html>
