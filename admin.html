<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Panel koo</title>
<style>
:root{--bg:#f6f4ff;--card:#fff;--text:#16132b;--muted:#5b5778;--line:rgba(22,19,43,.15);--accent:#7c3aed;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b14;--card:#15152a;--text:#f3f1ff;--muted:#a9a5c8;--line:rgba(255,255,255,.15);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;line-height:1.5}
.wrap{max-width:600px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
h1{font-size:1.5rem;margin:0 0 16px}h2{font-size:1.1rem;margin:0 0 10px}
label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:1rem}
button{padding:12px 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;font-size:1rem;margin-top:12px}
button.del{background:#dc2626;margin:0;padding:8px 12px;font-size:.85rem}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
#status{font-weight:600;min-height:1.5em}
small{color:var(--muted)}
</style>
</head>
<body><div class="wrap">
<h1>🎤 Panel koo</h1>
<div class="card">
  <h2>1. Seensa (al tokko qofa)</h2>
  <label>Repository</label><input id="repo" value="fufalemi10-alt/Fufaa">
  <label>GitHub token</label><input id="token" type="password" placeholder="github_pat_...">
  <small>Token kun bilbila kee keessa qofa kuufama.</small>
  <button id="saveTok">Kuusi</button>
</div>
<div class="card">
  <h2>2. Faarfannaa haaraa dabali</h2>
  <label>Linkii YouTube</label><input id="url" placeholder="https://youtu.be/...">
  <label>Maqaa faarfannaa (filannoo)</label><input id="title" placeholder="Yoo duwwaa ta’e ofumaan barbaadama">
  <button id="add">Dabali</button>
  <p id="status"></p>
</div>
<div class="card"><h2>3. Faarfannaa jiran</h2><div id="list"><small>Eegi…</small></div></div>
</div>
<script>
function $(i){return document.getElementById(i)}
function st(m){$("status").textContent=m}
var songs=[],sha=null;
try{$("token").value=localStorage.getItem("tok")||"";$("repo").value=localStorage.getItem("repo")||$("repo").value}catch(e){}
function enc(s){return btoa(unescape(encodeURIComponent(s)))}
function dec(s){return decodeURIComponent(escape(atob(s.replace(/\n/g,""))))}
function api(method,body){
  var r=$("repo").value.trim();
  return fetch("https://api.github.com/repos/"+r+"/contents/songs.json"+(method==="GET"?"?t="+Date.now():""),{
    method:method,
    headers:{Authorization:"Bearer "+$("token").value.trim(),Accept:"application/vnd.github+json"},
    body:body?JSON.stringify(body):undefined
  });
}
function vid(u){var m=u.match(/(?:v=|youtu\.be\/|shorts\/|live\/|embed\/)([\w-]{11})/);return m?m[1]:null}
function draw(){
  var l=$("list");
  if(!songs.length){l.innerHTML="<small>Amma faarfannaan hin jiru.</small>";return}
  l.innerHTML="";
  songs.forEach(function(s,i){
    var d=document.createElement("div");d.className="row";
    var t=document.createElement("span");t.textContent=s.title;
    var b=document.createElement("button");b.className="del";b.textContent="Haqi";
    b.onclick=function(){if(confirm("Haquu?")){songs.splice(i,1);push("Faarfannaa haqame")}};
    d.appendChild(t);d.appendChild(b);l.appendChild(d);
  });
}
function load(){
  if(!$("token").value){st("Dura token galchi.");return}
  api("GET").then(function(r){
    if(r.status===404){songs=[];sha=null;draw();return}
    if(!r.ok)throw new Error("Token ykn repository dogoggora ("+r.status+")");
    return r.json().then(function(j){sha=j.sha;songs=JSON.parse(dec(j.content));draw()});
  }).catch(function(e){st("Dogoggora: "+e.message)});
}
function push(msg){
  st("Ol kaa’aa jira…");
  var body={message:msg,content:enc(JSON.stringify(songs,null,2)),branch:"main"};
  if(sha)body.sha=sha;
  return api("PUT",body).then(function(r){
    if(!r.ok)throw new Error("Hin save ta’in ("+r.status+")");
    return r.json().then(function(j){sha=j.content.sha;draw();st("✅ Xumurameera! Daqiiqaa 1-2 booda website irratti mul’ata.")});
  }).catch(function(e){st("Dogoggora: "+e.message);load()});
}
$("saveTok").onclick=function(){
  try{localStorage.setItem("tok",$("token").value.trim());localStorage.setItem("repo",$("repo").value.trim())}catch(e){}
  st("Kuufameera.");load();
};
$("add").onclick=function(){
  var u=$("url").value.trim(),id=vid(u);
  if(!id){st("Linkii YouTube sirrii miti.");return}
  if(songs.some(function(s){return s.id===id})){st("Faarfannaan kun duraanuu jira.");return}
  var t=$("title").value.trim();
  var go=function(title){
    songs.unshift({id:id,title:title||"Faarfannaa haaraa",date:new Date().toISOString().slice(0,10)});
    push("Faarfannaa dabalame").then(function(){$("url").value="";$("title").value=""});
  };
  if(t){go(t);return}
  st("Maqaa barbaadaa jira…");
  fetch("https://noembed.com/embed?url="+encodeURIComponent("https://www.youtube.com/watch?v="+id))
    .then(function(r){return r.json()}).then(function(j){go(j.title)}).catch(function(){go("")});
};
if($("token").value)load();
</script>
</body>
</html>
