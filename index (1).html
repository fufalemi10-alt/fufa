<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maqaa Kee | Faarfataa</title>
<meta name="description" content="Marsaa dhaabbataa faarfataa: faarfannaa haaraa, fakkeenya fi walqunnamtii.">
<meta name="theme-color" content="#0b0b14">
<style>
:root{--bg:#f6f4ff;--card:#ffffff;--text:#16132b;--muted:#5b5778;--accent:#7c3aed;--accent2:#ec4899;--line:rgba(22,19,43,.1);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b14;--card:#15152a;--text:#f3f1ff;--muted:#a9a5c8;--line:rgba(255,255,255,.1);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0b14;--card:#15152a;--text:#f3f1ff;--muted:#a9a5c8;--line:rgba(255,255,255,.1);color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
.hero{text-align:center;padding:56px 0 32px;background:radial-gradient(600px 300px at 50% 0,rgba(124,58,237,.35),transparent 70%)}
.avatar{width:132px;height:132px;border-radius:50%;margin:0 auto 20px;display:grid;place-items:center;font-size:56px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 40px rgba(124,58,237,.45);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{font-size:clamp(2rem,8vw,3rem);margin:0;letter-spacing:-.02em;line-height:1.1}
.tag{color:var(--muted);margin:8px 0 22px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;font-weight:600;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border:0}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
section{padding:30px 0}
h2{font-size:1.35rem;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.songs{display:grid;gap:12px}
.song{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.play{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.song b{display:block}
.song small{color:var(--muted)}
.socials{display:grid;gap:12px}
.soc{display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:16px;text-decoration:none;color:#fff;font-weight:600}
.soc svg{width:26px;height:26px;fill:#fff;flex:none}
.soc.yt{background:#e11d1d}.soc.fb{background:#1877f2}.soc.tt{background:#111;border:1px solid #333}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:28px 0 40px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="avatar" id="avatar">🎤</div>
  <h1 id="name"></h1>
  <p class="tag" id="tagline"></p>
  <a class="btn" href="#faarfannaa">▶ Faarfannaa dhaggeeffadhu</a>
  <a class="btn ghost" href="#quunnamtii">Nu quunnami</a>
</div></header>

<main class="wrap">
  <section id="waaee"><h2>Waa’ee koo</h2><div class="card"><p id="bio" style="margin:0"></p></div></section>
  <section id="faarfannaa"><h2>Faarfannaa</h2><div class="songs" id="songs"></div></section>
  <section id="hordofi"><h2>Na hordofi</h2><div class="socials" id="socials"></div></section>
  <section id="quunnamtii"><h2>Quunnamtii</h2><div class="card"><p style="margin-top:0">Hojii waliin hojjechuuf, taphachuuf ykn gaaffii qabdaniif:</p><a class="btn" id="mail" href="#">✉ Email ergi</a></div></section>
</main>
<footer><div class="wrap">© <span id="yr"></span> <span id="name2"></span>. Mirgi hundi eegameera.</div></footer>

<script>
/* ===== AMMA AKKA FEDHIITTI JIJJIIRI (Edit here) ===== */
var CONFIG = {
  name: "Maqaa Kee",
  tagline: "Faarfataa · Afaan Oromoo",
  bio: "Maqaan koo … dha. Faarfannaa jaalala, aadaa fi abdii ilaalchisee hojjedha. Asirratti faarfannaa koo haaraa dhaggeeffachuu fi hordofuu dandeessu.",
  email: "ibsa@keessan.com",
  songs: [
    { title: "Faarfannaa 1", note: "YouTube irratti ilaali", url: "https://youtube.com/" },
    { title: "Faarfannaa 2", note: "YouTube irratti ilaali", url: "https://youtube.com/" }
  ],
  youtube: "https://youtube.com/",
  facebook: "https://facebook.com/",
  tiktok: "https://tiktok.com/"
};
/* ===================================================== */
function el(id){return document.getElementById(id)}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
document.title=CONFIG.name+" | Faarfataa";
el("name").textContent=CONFIG.name;el("name2").textContent=CONFIG.name;
el("tagline").textContent=CONFIG.tagline;el("bio").textContent=CONFIG.bio;
el("yr").textContent=new Date().getFullYear();
el("mail").href="mailto:"+CONFIG.email;
el("songs").innerHTML=CONFIG.songs.map(function(s){
  return '<a class="song" href="'+esc(s.url)+'" target="_blank" rel="noopener"><span class="play">▶</span><span><b>'+esc(s.title)+'</b><small>'+esc(s.note)+'</small></span></a>';
}).join("");
var ICON={
yt:'<svg viewBox="0 0 24 24"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2C.5 9.1.5 12 .5 12s0 2.9.5 4.8a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1c.5-1.9.5-4.8.5-4.8s0-2.9-.5-4.8zM9.7 15.5v-7l6 3.5-6 3.5z"/></svg>',
fb:'<svg viewBox="0 0 24 24"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.3v7A10 10 0 0 0 22 12z"/></svg>',
tt:'<svg viewBox="0 0 24 24"><path d="M16.6 5.8A4.3 4.3 0 0 1 15.5 3h-3.1v12.4a2.6 2.6 0 1 1-1.8-2.5V9.7a5.7 5.7 0 1 0 4.9 5.7V9a7.4 7.4 0 0 0 4.3 1.4V7.3a4.3 4.3 0 0 1-3.2-1.5z"/></svg>'};
el("socials").innerHTML=[
 ["yt","YouTube",CONFIG.youtube],["fb","Facebook",CONFIG.facebook],["tt","TikTok",CONFIG.tiktok]
].map(function(x){return '<a class="soc '+x[0]+'" href="'+esc(x[2])+'" target="_blank" rel="noopener">'+ICON[x[0]]+x[1]+'</a>'}).join("");
</script>
</body>
</html>
